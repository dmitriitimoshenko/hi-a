services:
  redis:
    image: redis:7
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "256mb"
      # noeviction: the bus lives here too, so unacknowledged stream entries
      # must never be dropped under memory pressure.
      - "--maxmemory-policy"
      - "noeviction"
    # Not published: reachable only on the compose network.
    # Uncomment to inspect from the host during debugging.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 9

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    # Not published: reachable only on the compose network.
    # Uncomment to inspect from the host during debugging.
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      start_period: 5s
      interval: 30s
      timeout: 3s
      retries: 9

  mail-tracker:
    build: ./mail-tracker
    image: hire_insight_ai_assistant_mail_tracker:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PORT=8082
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_DB=0
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=mail-tracker
      - STREAM_NEW_MAIL=new-mail
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8082/api/health-check --header 'x-api-version: 1' || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 9

  mail-processor:
    build: ./mail-processor
    image: hire_insight_ai_assistant_mail_processor:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mail-tracker:
        condition: service_healthy
      mail-mapper:
        condition: service_healthy
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=mail-processor
      - STREAM_GROUP=mail-processor-group
      # Replaces Kafka's auto.offset.reset=earliest: never skip a backlog.
      - STREAM_START_AT_OLDEST=true
      - STREAM_NEW_MAIL=new-mail
      - STREAM_INTERESTING_MAIL=interesting-mail
      - DATABASE_MAIL_PROCESSOR_URL=${DATABASE_MAIL_PROCESSOR_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLASSIFY_BY_CENTROID_THRESHOLD=${CLASSIFY_BY_CENTROID_THRESHOLD}
      - CLASSIFY_BY_CENTROID_THRESHOLDS=${CLASSIFY_BY_CENTROID_THRESHOLDS}
      - CLASSIFY_BY_CENTROID_MARGIN=${CLASSIFY_BY_CENTROID_MARGIN}
      - CLASSIFY_BY_CENTROID_COMMIT_BATCH_SIZE=${CLASSIFY_BY_CENTROID_COMMIT_BATCH_SIZE}
      - CLASSIFY_BY_CENTROID_THRESHOLD_MULTIPLIER=${CLASSIFY_BY_CENTROID_THRESHOLD_MULTIPLIER}
      - MAIL_MAPPER_TIMEOUT=${MAIL_MAPPER_TIMEOUT}
      - MAIL_MAPPER_URL=http://mail-mapper:8088
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8081/api/health-check --header 'x-api-version: 1' || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 9

  mail-mapper:
    build: ./mail-mapper
    image: hire_insight_ai_assistant_mail_mapper:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - PORT=8088
      - REDIS_URL=redis://redis:6379
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=mail-mapper
      - STREAM_GROUP=mail-mapper
      # Replaces Kafka's auto.offset.reset=earliest: never skip a backlog.
      - STREAM_START_AT_OLDEST=true
      - STREAM_FEEDBACK=feedback
      - GSA_BASE_URL=http://google-sheets-accessor:8083
      - HUNGARIAN_MIN_MATCH_SCORE=${HUNGARIAN_MIN_MATCH_SCORE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_MAIL_MAPPER_URL=${DATABASE_MAIL_MAPPER_URL}
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8088/api/health-check --header 'x-api-version: 1' || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 9

  google-sheets-accessor:
    build: ./google-sheets-accessor
    image: hire_insight_ai_assistant_google_sheets_accessor:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - PORT=8083
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/gsa-credentials.json
      - GSA_DB_HOST=${GSA_DB_HOST}
      - GSA_DB_PORT=${GSA_DB_PORT}
      - GSA_DB_PASS=${GSA_DB_PASS}
      - GSA_DB_USER=${GSA_DB_USER}
      - GSA_DB_NAME=${GSA_DB_NAME}
      - GSA_DB_SSLMODE=${GSA_DB_SSLMODE}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=google-sheets-accessor
      - STREAM_GROUP=google-sheets-accessor
      - STREAM_APPLICATION_UPDATE_PROCESSED=application-update-processed
      - STREAM_ADD_APPLICATION_EMBEDDING=add-embedding-for-application
      - STREAM_SAVE_APPLICATION_EMBEDDING=save-embedding-for-application
      - SHEET_ID=${SHEET_ID}
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='x-api-version: 1' http://localhost:8083/api/health-check >/dev/null || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 3s
      retries: 3

  application-embedding-generator:
    build: ./application-embedding-generator
    image: hire_insight_ai_assistant_application_embedding_generator:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=application-embedding-generator
      - STREAM_GROUP=application-embedding-generator
      - STREAM_ADD_APPLICATION_EMBEDDING=add-embedding-for-application
      - STREAM_SAVE_APPLICATION_EMBEDDING=save-embedding-for-application
      # Replaces kafka.FirstOffset: consume everything already in the stream.
      - STREAM_START_AT_OLDEST=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - API_VERSION=1
      - PORT=8089
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='x-api-version: 1' http://localhost:8089/api/health-check >/dev/null || exit 1"]
      start_period: 10s
      interval: 30s
      timeout: 3s
      retries: 3

  hire-event-processor:
    build: ./hire-event-processor
    image: hire_insight_ai_assistant_hire_event_processor:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mail-processor:
        condition: service_healthy
      google-sheets-accessor:
        condition: service_healthy
    environment:
      - PORT=8085
      - REDIS_URL=redis://redis:6379
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=hire-event-processor
      - STREAM_GROUP=hire-event-processor-group
      # Replaces kafka.FirstOffset: consume everything already in the stream.
      - STREAM_START_AT_OLDEST=true
      - STREAM_INTERESTING_MAIL=interesting-mail
      - STREAM_HIRE_EVENT=hire-event
      - STREAM_APPLICATIONS_SYNC_UNPROCESSED=applications-sync-unprocessed
      - STREAM_APPLICATIONS_SYNC_PROCESSED=applications-sync-processed
      - STREAM_APPLICATION_UPDATE_UNPROCESSED=application-update-unprocessed
      - STREAM_APPLICATION_UPDATE_PROCESSED=application-update-processed
      - GSA_BASE_URL=http://google-sheets-accessor:8083
      - SHEET_ID=${SHEET_ID}
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='x-api-version: 1' http://localhost:8085/api/health-check >/dev/null || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 3s
      retries: 9

  hire-event-notifier:
    build: ./hire-event-notifier
    image: hire_insight_ai_assistant_hire_event_notifier:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      hire-event-processor:
        condition: service_healthy
    environment:
      - PORT=8086
      - REDIS_URL=redis://redis:6379
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=hire-event-notifier
      - STREAM_GROUP=hire-event-notifier-group
      - STREAM_NOTIFICATION=notification
      - STREAM_NOTIFICATION_SYNC=notification-sync
      - STREAM_HIRE_EVENT=hire-event
      - STREAM_APPLICATIONS_SYNC_PROCESSED=applications-sync-processed
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header='x-api-version: 1' http://localhost:8086/api/health-check >/dev/null || exit 1"]
      start_period: 15s
      interval: 30s
      timeout: 3s
      retries: 3

  telegram-bot:
    build: ./telegram-bot
    image: hire_insight_ai_assistant_telegram_bot:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      hire-event-processor:
        condition: service_healthy
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_DB=1
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=telegram-bot
      - STREAM_GROUP=telegram-bot-group
      - STREAM_NOTIFICATION=notification
      - STREAM_NOTIFICATION_SYNC=notification-sync
      - STREAM_APPLICATION_UPDATE_UNPROCESSED=application-update-unprocessed
      - STREAM_FEEDBACK=feedback
      - GSA_BASE_URL=http://google-sheets-accessor:8083
      - API_VERSION=1
      - TG_ID=${TG_ID}

  jobs-master:
    build: ./jobs-master
    image: hire_insight_ai_assistant_jobs_master:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mail-processor:
        condition: service_healthy
      google-sheets-accessor:
        condition: service_healthy
    environment:
      - SHEET_ID=${SHEET_ID}
      - REDIS_URL=redis://redis:6379
      - STREAM_DB=2
      - STREAM_CONSUMER_ID=jobs-master
      - STREAM_APPLICATIONS_SYNC=applications-sync-unprocessed
      - GSA_BASE_URL=http://google-sheets-accessor:8083

volumes:
  redis_data:
  postgres_data:
